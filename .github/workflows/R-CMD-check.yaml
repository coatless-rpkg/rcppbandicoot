# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Nightly, with no known-failure exclusions (see RCPPBANDICOOT_XFAIL below)
    # and a verdict of its own (see the last step in the job).
    - cron: '17 5 * * *'
  workflow_dispatch:
    # Defaults to false, so a plain manual run behaves exactly as it always
    # has. It exists because a scheduled workflow only ever runs from the
    # default branch: without this switch the nightly path could not be
    # exercised even once before it is merged, and its first execution would
    # be on main, unobserved, at 05:17. Set it to true on a manual run to get
    # a nightly without waiting for one.
    inputs:
      nightly:
        description: 'Run as the nightly: no exclusions, compare against nightly_expect'
        type: boolean
        default: false

name: R-CMD-check

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    # The device-free leg shares both its runner and its R version with the
    # gating Linux leg, so it needs a distinguishing suffix. Only that leg is
    # renamed: branch protection matches required checks by job name, and the
    # names that already exist have to keep resolving.
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})${{ matrix.config.opencl_runtime == 'none' && ' device-free' || '' }}

    # Everything except the gating Linux leg is experimental: its failure does
    # not fail the workflow, so a pull request gates on that one leg alone.
    # The nightly is the exception, and no leg is excused there -- but note
    # what it is that has to be able to turn the run red. It is no longer
    # R CMD check exiting non-zero, which on a nightly it is *supposed* to do;
    # it is the last step in this job, which compares the operations that
    # failed against the ones recorded as already broken. That step needs a
    # failing job to be heard, since a failing job is the only thing GitHub
    # notifies anyone about.
    #
    # `false && anything` is false, so putting the event tests first forces
    # continue-on-error off for every leg on a nightly without needing a
    # second expression.
    #
    # The manual switch is read as github.event.inputs.nightly, a STRING,
    # rather than as the typed inputs.nightly. Comparing a string to a boolean
    # sends both through GitHub's numeric cast, where 'true' becomes NaN and
    # the comparison is false however it is written -- so a dispatched nightly
    # silently behaved like a normal run in some expressions and like a
    # nightly in others. github.event.inputs.<name> is the raw string on
    # workflow_dispatch and null everywhere else, so 'true' compares cleanly
    # and null does not match.
    continue-on-error: ${{ github.event_name != 'schedule' && github.event.inputs.nightly != 'true' && matrix.config.experimental }}

    # The two Linux legs gate the build: one with a real device, where every
    # operation runs for real and a regression fails the job, and one with no
    # device, which is the configuration CRAN and r-universe actually ship.
    # macOS and Windows are best-effort. PoCL's LLVM JIT segfaults
    # nondeterministically on macOS and Intel's Windows runtime crashes on
    # every compute kernel; measured rates are in the matrix comment below.
    # Both are upstream defects, so until they are fixed those legs prove only
    # that the package compiles, installs, and passes its device-free tests.
    # They are NOT allowed to block a pull request, and they must not be
    # green-by-skipping-everything on a platform where the GPU genuinely works,
    # which is why only the two upstream-broken platforms carry an xfail list.
    strategy:
      fail-fast: false
      matrix:
        config:
          # nightly_expect / nightly_exact are read only on a nightly and do
          # nothing on push or pull_request. They are what stops the nightly
          # from being red every single night.
          #
          # The nightly clears the exclusions, so the known-broken operations
          # run for real and their failure is the point of the run rather than
          # an accident. Failing the job on it made the nightly unconditionally
          # red on two platforms at once, and a signal that is always red is
          # not a signal -- nobody reads it, and the day macOS starts working
          # nobody notices. So the nightly reports which operations died and
          # goes red only when that set has MOVED away from nightly_expect.
          #
          # nightly_expect is a comma-separated list of test-script stems:
          # tests/zz-gpu-transpose.R is `gpu-transpose`. That is deliberately
          # not the vocabulary xfail uses, and the two lists cannot be merged.
          # xfail holds gpu_* names that skip_if_xfail() consults from inside a
          # test, and they are not in correspondence with the scripts: both
          # zz-gpu-seed.R and zz-gpu-sum-na.R gate on another operation's key
          # (gpu_randu and gpu_sum), so ten xfail names cover twelve scripts.
          # What a crashed run leaves behind is a per-SCRIPT exit status, so
          # per script is what can honestly be recorded and compared.
          #
          # nightly_exact: 'true' requires the observed set to equal this one,
          # and moving in either direction turns the run red -- something new
          # broke, or something started working, and the second is the upstream
          # fix this package is waiting for. Empty means the leg's crash is
          # nondeterministic, so equality is not a question that has an answer
          # there and only the boundaries are asserted instead: nothing outside
          # the list may fail, and the list may not empty out. See macOS below.
          #
          # These lists live in the matrix rather than in a data file of their
          # own. A file would have had to go under .github/ -- ^\.github$ is
          # already in .Rbuildignore, whereas a file at the repo root would NOT
          # be and would ship inside the package tarball to CRAN. That was
          # workable; the matrix wins anyway, because the day an operation
          # starts working the fix is to shorten this list AND the xfail list
          # three lines above it, and two lists that must be edited together
          # are much likelier to be if they are read together.

          # The gating leg: a real PoCL device, no exclusions, every operation
          # run for real. It is also the only leg that runs the examples,
          # since it is the only platform where every operation works.
          # Nothing may fail here, on any event -- hence the empty expectation.
          - os: ubuntu-24.04
            r: 'release'
            experimental: false
            xfail: ''
            nightly_expect: ''
            nightly_exact: 'true'
            opencl_runtime: 'auto'
            gpu_examples: 'true'
            opencl_version: ''
            opencl_version_sha256: ''
            http_user_agent: ''

          # The CRAN configuration: OpenCL headers and an ICD loader, no
          # runtime and so no device at all. That is exactly what CRAN and
          # r-universe provision, and nothing else in this matrix exercises
          # it. This leg asserts that the package still compiles and links
          # there, enumerates zero devices, and skips the device tests
          # cleanly rather than erroring.
          #
          # It gates, for two reasons. It is the configuration almost every
          # user of a binary install actually has, so a regression here is a
          # regression for the majority. And it is the ONLY leg that can run
          # the no-device error path: test-probe.R's "a GPU call raises an R
          # condition rather than crashing" is unreachable wherever a device
          # exists, so without this leg that assertion never executes at all.
          # The two Linux legs are complements, not duplicates -- each covers
          # the blind spot the other cannot reach.
          #
          # A build with no backend at all cannot be tested: config.hpp
          # #errors unless one of COOT_USE_OPENCL/CUDA/VULKAN is defined, so
          # headers-plus-loader is as close to a GPU-free machine as this
          # package can be compiled for. RCPPBANDICOOT_REQUIRE_GPU is false
          # here (see env below): with it set, zero devices would be a hard
          # failure, the opposite of what this leg asserts.
          - os: ubuntu-24.04
            r: 'release'
            experimental: false
            xfail: ''
            nightly_expect: ''
            nightly_exact: 'true'
            opencl_runtime: 'none'
            gpu_examples: ''
            opencl_version: ''
            opencl_version_sha256: ''
            http_user_agent: ''

          # r-devel. This package has already had to absorb upstream
          # compiler-warning breakage twice, and r-devel is where the next one
          # surfaces first. http_user_agent follows r-lib's own example
          # workflow: P3M serves no binaries to an R-devel user agent, so
          # asking as 'release' avoids building every dependency from source.
          - os: ubuntu-24.04
            r: 'devel'
            experimental: true
            xfail: ''
            nightly_expect: ''
            nightly_exact: 'true'
            opencl_runtime: 'auto'
            gpu_examples: ''
            opencl_version: ''
            opencl_version_sha256: ''
            http_user_agent: 'release'

          # xfail lists gpu_* operations skipped on that runner. On the nightly
          # schedule the list is cleared (see RCPPBANDICOOT_XFAIL below) so the
          # real, unmitigated state is visible. Both lists were measured by
          # running each operation in its own R process, so a crash could not
          # mask the operations after it.
          #
          # macOS keeps the whole list, and the reason is worth reading before
          # anyone shortens it again. A probe running each operation alone in a
          # fresh process, 20 times, with the PoCL cbs workaround above, gave
          # gpu_transpose 4/20 crashed, gpu_element_square 3/20,
          # gpu_matrix_multiply 1/20 and the other five 0/20. Excluding only
          # those three was tried, and in the very first CI run six of the ten
          # operation scripts segfaulted -- including gpu_matrix_add, gpu_sum
          # and gpu_randu, all of which had measured 0/20.
          #
          # So the isolated per-operation rate is a LOWER BOUND, not an
          # estimate. One operation per fresh process is the most favourable
          # case for a code generation fault; a real test script compiles
          # several kernels in one session and the rate rises sharply. The
          # crash is a property of the JIT, not of any operation, which is also
          # why an earlier 3-run pass had gpu_matrix_add failing 3/3 where 20
          # runs gave 0/20. No operation can be released on its own evidence.
          #
          # That same nondeterminism is exactly why macOS carries an empty
          # nightly_exact. A set that was three scripts under one measurement
          # and six under the next cannot be compared for equality: the nightly
          # would drift every night, be red every night, and be worth nothing
          # every night -- which is the failure the nightly_expect machinery
          # exists to remove, reintroduced by the back door. So the whole list
          # is recorded as able to fail, and the only transition that turns the
          # run red on macOS is the one actually worth waking up for: every
          # script passing, meaning the JIT fault is gone. Which subset died is
          # still tabulated every night, so the trend stays readable without
          # being alarmed on. The cost is honest and worth stating: on this leg
          # a single operation becoming reliable is invisible to the red/green
          # verdict, because on this leg it is not distinguishable from luck.
          #
          # Windows, 3 runs per operation: every operation crashed every time,
          # while the device probes succeed. Unchanged with Intel's vectoriser
          # disabled (CL_CONFIG_USE_VECTORIZER=False), so that lever is ruled
          # out. That is a deterministic failure, not a flaky one -- the
          # runtime cannot compile a kernel at all -- so Windows does get an
          # exact comparison, and one operation there starting to work is news
          # rather than noise.
          #
          # Both lists therefore stay whole. What the per-operation split buys
          # here is not a shorter list but a readable failure: the core
          # device-free suite still completes on both platforms even when every
          # GPU script dies, and each crash names its own operation.
          - os: macos-latest
            r: 'release'
            experimental: true
            xfail: 'gpu_transpose,gpu_matrix_add,gpu_matrix_multiply,gpu_element_square,gpu_sum,gpu_sum_multipass,gpu_mean,gpu_eye,gpu_randu,gpu_session'
            nightly_expect: 'gpu-element-square,gpu-eye,gpu-matrix-add,gpu-matrix-multiply,gpu-mean,gpu-randu,gpu-seed,gpu-session,gpu-sum,gpu-sum-multipass,gpu-sum-na,gpu-transpose'
            nightly_exact: ''
            opencl_runtime: 'auto'
            gpu_examples: ''
            opencl_version: ''
            opencl_version_sha256: ''
            http_user_agent: ''

          # The LLVM 20 runtime pin this leg needs is currently unreachable.
          # The pre-migration workflow shipped Intel's official runtime, whose
          # common_clang64.dll reports clang 20.0.0git, where the oclcpuexp
          # release we moved to reports 22.1.0 -- and failure tracks the LLVM
          # generation across all three platforms (PoCL on 16 works, PoCL on 21
          # is flaky, this on 22 fails outright), so the runtime swap is the
          # most likely thing the migration broke. Pinning 2025-WW13, the last
          # oclcpuexp release on LLVM 20, was tried: setup-opencl refuses it
          # because the GitHub API reports no SHA-256 digest for that release's
          # asset, and the action requires one. Fixing that belongs in the
          # action, not here; until then the hypothesis stays untested and the
          # whole list stands.
          # Pinned to the last oclcpuexp release built on LLVM 20. The
          # pre-migration workflow shipped Intel's official runtime, whose
          # common_clang64.dll reports clang 20.0.0git, where the release this
          # leg moved to reports 22.1.0 -- and failure tracks the LLVM
          # generation across the whole matrix (PoCL on 16 works, PoCL on 21 is
          # nondeterministic, this on 22 fails on every operation). So the
          # runtime swap is the most likely thing the migration broke, and
          # because the old CI never executed a kernel nobody could have seen it.
          #
          # The exclusions are CLEARED so the question actually gets asked. If
          # the operations pass, the swap was the fault and the fix is this pin.
          # If they still crash, Windows never worked, the runtime choice is
          # irrelevant, and the list goes back. The leg is experimental either
          # way, so a wrong guess costs a red mark on a non-blocking job.
          #
          # version-sha256 is required because the GitHub API reports no digest
          # for this release's asset -- the exact gap that made this experiment
          # impossible until setup-opencl grew the input. The value was computed
          # from the downloaded archive, so it pins the artifact against later
          # substitution; it does not independently authenticate it.
          - os: windows-2025
            r: 'release'
            experimental: true
            xfail: ''
            nightly_expect: 'gpu-element-square,gpu-eye,gpu-matrix-add,gpu-matrix-multiply,gpu-mean,gpu-randu,gpu-seed,gpu-session,gpu-sum,gpu-sum-multipass,gpu-sum-na,gpu-transpose'
            nightly_exact: 'true'
            opencl_runtime: 'auto'
            gpu_examples: ''
            opencl_version: '2025-WW13'
            opencl_version_sha256: 'c4800a819d5ba19e483505360a96e858aac1abba550b8e96fbf7a2a0c91bf9cb'
            http_user_agent: ''

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

      # Turns every skip_if_no_gpu() into a hard error.  This is the whole
      # point of the migration: CRAN never sets this variable, so the same
      # suite skips cleanly there, while here a runner that enumerates zero
      # devices fails the job instead of quietly reporting all-skips.  The
      # previous workflow was green whether or not OpenCL worked.
      #
      # Derived from the runtime rather than carried as its own matrix key so
      # the two cannot drift apart: the device-free leg is the one that must
      # not demand a device, and it is the leg that installs no runtime.  The
      # 'false' it produces there reads as unset to env_true() in
      # tests/testthat/helper-gpu.R, which honours only 1/true/yes/on.
      RCPPBANDICOOT_REQUIRE_GPU: ${{ matrix.config.opencl_runtime != 'none' }}
      RCPPBANDICOOT_REQUIRE_FP64: ${{ matrix.config.opencl_runtime != 'none' }}

      # Every device-touching example is guarded by
      # @examplesIf nzchar(Sys.getenv("RCPPBANDICOOT_RUN_GPU_EXAMPLES")), so
      # examples touch a device only where this is set.  They have to be
      # guarded: an example that reaches coot_init() writes a compiled-kernel
      # cache under $HOME (cache_meat.hpp), R CMD check runs examples in their
      # own process, and the HOME redirect in tests/testthat/helper-00-cache.R
      # covers the test process only -- so unguarded examples write outside
      # the session temporary directory, which CRAN policy forbids.  Only the
      # gating Linux leg sets it, being the only platform where every
      # operation actually works.
      RCPPBANDICOOT_RUN_GPU_EXAMPLES: ${{ matrix.config.gpu_examples }}

      # Each GPU operation has its own top-level tests/zz-gpu-<op>.R, which
      # R CMD check runs as its own R CMD BATCH process, so a hard crash --
      # the failure mode on macOS and Windows, which no R handler can catch --
      # fails one named script instead of destroying the whole run.
      # tools:::.runPackageTests stops at the FIRST failing script unless this
      # is set, which would throw away everything after the first crasher and
      # defeat the split. Set on every leg: on the gating ones it means a real
      # regression names every failing script rather than only the
      # alphabetically first. The check still exits with an ERROR either way.
      _R_CHECK_NO_STOP_ON_TEST_ERROR_: true

      # On push/PR, exclude the operations known to be broken on this runner.
      # On a nightly, exclude nothing: the known-broken operations run for
      # real, and the last step in this job decides what their failing means.
      #
      # The event tests have to come first and produce the exclusion list, not
      # the empty string.  GitHub treats '' as false, so writing it the other
      # way round (`event_name == 'schedule' && '' || xfail`) makes the
      # schedule branch fall straight through to the full exclusion list --
      # the nightly then excludes precisely the operations it exists to run.
      # The same trap is why the nightly condition is expressed here as its
      # negation (`!= 'schedule'` and `!= true`) rather than hoisted into a
      # shared env var: an env value is a string, and the string 'false' is
      # truthy, so `env.X` would read as nightly on every event there is.
      RCPPBANDICOOT_XFAIL: ${{ github.event_name != 'schedule' && github.event.inputs.nightly != 'true' && matrix.config.xfail || '' }}

    steps:
      - uses: actions/checkout@v6

      - name: Restore execute bit on shell scripts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # NTFS drops the git-stored +x bit on checkout, so R CMD build
        # otherwise warns "did not have execute permissions: corrected"
        # every run. chmod via MSYS bash lands in a form R's tar sees.
        run: chmod +x configure cleanup

      # Installs headers, an ICD loader, and a real CPU device (PoCL on Linux
      # and macOS, Intel's CPU runtime on Windows), then fails the job if no
      # device enumerates.  Exports OPENCL_CPPFLAGS / OPENCL_LIBS -- which
      # configure.win already read and configure.ac now reads too -- plus
      # OpenCL_ROOT / OpenCL_LIBRARY, OCL_ICD_VENDORS or OCL_ICD_FILENAMES,
      # and SDKROOT on macOS.
      #
      # The device-free leg passes runtime 'none', which stops after the
      # headers and the loader.  verify and require-fp64 are documented as
      # never fatal for that runtime, so zero devices is reported there rather
      # than failing the job, which is what that leg is asserting.
      - name: Set up OpenCL
        id: opencl
        uses: coatless-actions/setup-opencl@v1
        with:
          runtime: ${{ matrix.config.opencl_runtime }}
          # Honoured only for the Intel runtime on Windows; empty elsewhere
          # means "the tested version for this runner". See the Windows entry
          # in the matrix for why that leg pins one.
          version: ${{ matrix.config.opencl_version }}
          version-sha256: ${{ matrix.config.opencl_version_sha256 }}
          verify: 'true'
          require-fp64: 'true'

      - name: Report the OpenCL device
        shell: bash
        run: |
          echo "runtime  : ${{ steps.opencl.outputs.runtime-name }}"
          echo "platform : ${{ steps.opencl.outputs.platform-version }}"
          echo "device   : ${{ steps.opencl.outputs.device-name }}"
          echo "count    : ${{ steps.opencl.outputs.device-count }}"
          echo "fp64     : ${{ steps.opencl.outputs.fp64 }}"

      # Mitigates the PoCL JIT segfault described above. loopvec (PoCL's
      # default kernel compilation method) runs LLVM's loop vectorizer,
      # which is the most likely source of a code-generation bug that
      # corrupts memory unpredictably; cbs (context-based switching) avoids
      # that pass entirely. Serializing to one worker thread additionally
      # rules out a compile-time race as a contributing cause. Both are
      # PoCL-specific and a no-op for Intel's runtime on Windows, so this
      # only needs to run on macOS.
      - name: Work around a PoCL JIT crash (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "POCL_WORK_GROUP_METHOD=cbs" >> "$GITHUB_ENV"
          echo "POCL_CPU_MAX_CU_COUNT=1" >> "$GITHUB_ENV"

      # Installs CLBlast and verifies a GEMM produces correct results; the
      # verification is not fatal on the device-free leg, where there is
      # nothing to run it on.  Exports CLBLAST_CPPFLAGS / CLBLAST_LIBS --
      # which configure.win already read and configure.ac now reads too --
      # plus CLBlast_DIR (unused by this package, exported for contract
      # parity).
      - name: Set up CLBlast
        uses: coatless-actions/setup-clblast@v1

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http_user_agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        id: check
        # The one place the nightly diverges from push and pull_request. On a
        # nightly the check is EXPECTED to exit non-zero, because the excluded
        # operations are running for real, so its result must not be the job's
        # result -- the step below decides that instead, and it cannot decide
        # anything if the job has already ended here. On every other event this
        # evaluates to false, which is precisely the default, so push and
        # pull_request keep gating exactly as before.
        #
        # This is a step-level continue-on-error, deliberately, not the
        # job-level one above: the job-level flag would swallow the verdict
        # step's failure too and the nightly could never go red at all.
        continue-on-error: ${{ github.event_name == 'schedule' || github.event.inputs.nightly == 'true' }}
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # The nightly's actual verdict, and the only step that reads
      # nightly_expect. It tabulates which per-operation test script died,
      # writes that to the run summary so the state is legible without opening
      # a log, and fails the job only when the set has moved.
      #
      # always(), because the step it interprets is allowed to fail: a plain
      # `if` would skip this whenever there was something to report, leaving
      # the nightly red with nothing to read, which is where this started.
      - name: Compare the unmitigated GPU state against the recorded one
        if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.nightly == 'true') }}
        shell: bash
        env:
          EXPECTED: ${{ matrix.config.nightly_expect }}
          EXACT: ${{ matrix.config.nightly_exact }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          LEG: ${{ matrix.config.os }} (R ${{ matrix.config.r }}${{ matrix.config.opencl_runtime == 'none' && ', device-free' || '' }})
        run: |
          set -euo pipefail

          # Set comparison is sort-order sensitive, so pin the collation rather
          # than inherit whatever locale a given runner image ships with.
          export LC_ALL=C

          summary="${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          rc=0

          # ::error:: puts the reason on the run itself, which is the part a
          # notification mail quotes; the summary line is for whoever then
          # opens the run and wants the table underneath it.
          note_failure() {
            echo "::error title=nightly drift on ${LEG}::$1"
            printf '\n> [!IMPORTANT]\n> %s\n' "$1" >> "$summary"
            rc=1
          }

          printf '## %s\n\n' "$LEG" >> "$summary"

          # r-lib/actions/check-r-package leaves <check-dir>/<pkg>.Rcheck and
          # its check-dir input defaults to 'check'. Globbed rather than named
          # so a package rename does not turn this into a step that silently
          # finds nothing and reports everything as fixed.
          check_dir=""
          for d in check/*.Rcheck; do
            if [ -d "$d" ]; then
              check_dir="$d"
              break
            fi
          done

          if [ -z "$check_dir" ]; then
            printf 'R CMD check left no results directory: nothing ran.\n' >> "$summary"
            note_failure "the job failed before R CMD check produced any results"
            exit 1
          fi

          tests_dir="$check_dir/tests"
          tmp="$(mktemp -d)"
          : > "$tmp/observed"
          : > "$tmp/notrun"
          total=0

          printf '| operation | outcome |\n| --- | :-- |\n' >> "$summary"

          # tests/zz-gpu-<op>.R is the unit, because it is the unit R CMD check
          # can report on after a crash: tools:::.runPackageTests renames
          # <script>.Rout to <script>.Rout.fail when the process exits
          # non-zero, and an access violation exits non-zero. That rename is
          # the only trace the failure mode on macOS and Windows leaves behind,
          # since no R-level handler ever gets to run. The scripts are
          # enumerated from the checkout rather than listed here, so a new
          # operation is picked up the day it is added -- and shows up as drift
          # against nightly_expect, which is the correct thing for it to do.
          for script in tests/zz-gpu-*.R; do
            [ -e "$script" ] || continue
            base="$(basename "$script" .R)"
            op="${base#zz-}"
            total=$((total + 1))
            if [ -f "$tests_dir/$base.Rout.fail" ]; then
              printf '%s\n' "$op" >> "$tmp/observed"
              printf '| `%s` | **failed** |\n' "$op" >> "$summary"
            elif [ -f "$tests_dir/$base.Rout" ]; then
              printf '| `%s` | passed |\n' "$op" >> "$summary"
            else
              printf '%s\n' "$op" >> "$tmp/notrun"
              printf '| `%s` | did not run |\n' "$op" >> "$summary"
            fi
          done

          sort -u -o "$tmp/observed" "$tmp/observed"
          printf '%s\n' "${EXPECTED:-}" \
            | tr ',' '\n' | tr -d '[:blank:]\r' | sed '/^$/d' | sort -u > "$tmp/expected"

          n_observed="$(wc -l < "$tmp/observed" | tr -d '[:blank:]')"
          n_expected="$(wc -l < "$tmp/expected" | tr -d '[:blank:]')"

          printf '\n%s of %s operations failed; %s recorded as expected to be able to fail.\n' \
            "$n_observed" "$total" "$n_expected" >> "$summary"

          if [ -s "$tmp/notrun" ]; then
            # Comparing now would report operations that never executed as
            # having started working, which is the one thing this step must
            # never say. Report the gap and make no claim about the rest.
            note_failure "R CMD check did not reach every operation ($(paste -sd, "$tmp/notrun")); no comparison was made"
          else
            new_fail="$(comm -13 "$tmp/expected" "$tmp/observed")"
            new_pass="$(comm -23 "$tmp/expected" "$tmp/observed")"

            if [ -n "$new_fail" ]; then
              note_failure "newly failing: $(printf '%s' "$new_fail" | paste -sd, -)"
            fi

            if [ "${EXACT:-}" = "true" ]; then
              # An operation leaving the expected set on a deterministic leg is
              # the upstream fix this package has been waiting for. It goes red
              # so that somebody shortens this leg's nightly_expect AND its
              # xfail, the second of which is what actually re-enables the
              # operation on push and pull_request. Absorbing it silently would
              # mean the fix arrived and nothing changed.
              if [ -n "$new_pass" ]; then
                note_failure "newly passing: $(printf '%s' "$new_pass" | paste -sd, -)"
              fi
            else
              # Nondeterministic leg: which subset dies varies run to run, so a
              # shrinking set is not evidence of anything and is reported
              # without a verdict. Only the fault disappearing entirely is.
              if [ -n "$new_pass" ]; then
                printf '\nPassed tonight, though recorded as able to fail: `%s`. This leg crashes nondeterministically, so that is not treated as a change.\n' \
                  "$(printf '%s' "$new_pass" | paste -sd, -)" >> "$summary"
              fi
              if [ "$n_observed" -eq 0 ] && [ "$n_expected" -gt 0 ]; then
                note_failure "every operation passed on a leg where $n_expected are recorded as able to fail -- the upstream fault may be gone"
              fi
            fi
          fi

          # A nightly that watched only the operation list would go green on a
          # new compiler warning or a failed install, because neither is an
          # operation -- and it would have been red for those before this step
          # existed. So everything R CMD check flagged outside the tests
          # section is reported too. 00check.log carries a status either on the
          # '* checking ...' line itself, or, when the check printed output
          # first, on a line of its own just below it with a single leading
          # space; the indented excerpt blocks are two spaces in and so cannot
          # be mistaken for one.
          if [ -f "$check_dir/00check.log" ]; then
            other="$(awk '
              /^\* checking / {
                line = $0
                sub(/^\* checking /, "", line)
                if (match(line, /\.\.\.[ ]*(ERROR|WARNING)$/)) {
                  status = substr(line, RSTART)
                  sub(/^\.\.\.[ ]*/, "", status)
                  what = substr(line, 1, RSTART - 1)
                  sub(/[ ]+$/, "", what)
                  print status " " what
                  section = ""
                } else {
                  sub(/[ ]*\.\.\.[ ]*$/, "", line)
                  section = line
                }
                next
              }
              /^ (ERROR|WARNING)$/ { if (section != "") print $1 " " section }
            ' "$check_dir/00check.log" | grep -vE '^(ERROR|WARNING) tests$' || true)"

            if [ -n "$other" ]; then
              printf '\nR CMD check also reported, outside the test scripts:\n\n' >> "$summary"
              printf '%s\n' "$other" | sed 's/^/- /' >> "$summary"
              note_failure "R CMD check reported a problem unrelated to the GPU operations"
            fi
          fi

          # Backstop. The check step is allowed to fail on a nightly, so if it
          # failed and nothing above accounts for it, report that rather than
          # call the run green on a failure this step did not understand.
          if [ "${CHECK_OUTCOME:-}" = "failure" ] && [ "$rc" -eq 0 ] && [ "$n_observed" -eq 0 ]; then
            note_failure "R CMD check failed, but no operation failed and no other check problem was found -- read the log"
          fi

          # Printed on every nightly, passing or not, so that recording a new
          # expectation is a copy and a paste rather than a transcription.
          as_list() {
            if [ -s "$1" ]; then paste -sd, "$1"; else printf '(none)'; fi
          }
          printf '\nRecorded (`nightly_expect`): `%s`\n' "$(as_list "$tmp/expected")" >> "$summary"
          printf '\nObserved tonight: `%s`\n' "$(as_list "$tmp/observed")" >> "$summary"

          exit "$rc"
