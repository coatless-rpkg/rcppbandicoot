# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Nightly, with no known-failure exclusions (see RCPPBANDICOOT_XFAIL below).
    - cron: '17 5 * * *'
  workflow_dispatch:

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # xfail lists the gpu_* operations known to be broken on that
          # runner's device.  Every entry is a bug someone has to fix; the
          # nightly run below clears the list so they are exercised for real.
          #
          # macOS: 'apple' (Apple's own OpenCL.framework, tried as an
          # alternative to PoCL's crashing JIT below) enumerates zero devices
          # on this runner, so that is not a usable alternative -- back to
          # 'pocl' via 'auto'. PoCL's LLVM JIT segfaulted compiling a kernel
          # in most runs observed while building this workflow, but a
          # different operation triggered it each time (gpu_element_square,
          # then separately gpu_transpose, then separately gpu_eye) with one
          # run showing no crash at all -- a nondeterministic JIT
          # code-generation bug, not a specific broken operation. The xfail
          # list below is therefore the union of everything observed to
          # crash or return a wrong answer across those runs, to give this
          # leg the best available chance of a clean run; residual flakiness
          # on a still-listed-safe operation remains possible and would show
          # up as a fresh crash here rather than a silent wrong answer.
          - {os: ubuntu-24.04,  r: 'release', xfail: '', opencl_runtime: 'auto'}
          - {os: macos-latest,  r: 'release', xfail: 'gpu_element_square,gpu_matrix_add,gpu_matrix_multiply,gpu_transpose,gpu_eye,gpu_sum_multipass', opencl_runtime: 'auto'}
          - {os: windows-2025,  r: 'release', xfail: '', opencl_runtime: 'auto'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

      # Turns every skip_if_no_gpu() into a hard error.  This is the whole
      # point of the migration: CRAN never sets this variable, so the same
      # suite skips cleanly there, while here a runner that enumerates zero
      # devices fails the job instead of quietly reporting all-skips.  The
      # previous workflow was green whether or not OpenCL worked.
      RCPPBANDICOOT_REQUIRE_GPU: 'true'
      RCPPBANDICOOT_REQUIRE_FP64: 'true'

      # On push/PR, exclude the operations known to be broken on this runner.
      # On the nightly schedule, exclude nothing: the known-broken operations
      # run for real and the nightly stays red until upstream fixes them.
      RCPPBANDICOOT_XFAIL: ${{ github.event_name == 'schedule' && '' || matrix.config.xfail }}

    steps:
      - uses: actions/checkout@v6

      - name: Restore execute bit on shell scripts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # NTFS drops the git-stored +x bit on checkout, so R CMD build
        # otherwise warns "did not have execute permissions: corrected"
        # every run. chmod via MSYS bash lands in a form R's tar sees.
        run: chmod +x configure cleanup

      # Installs headers, an ICD loader, and a real CPU device (PoCL on Linux
      # and macOS, Intel's CPU runtime on Windows), then fails the job if no
      # device enumerates.  Exports OPENCL_CPPFLAGS / OPENCL_LIBS -- which
      # configure.win already read and configure.ac now reads too -- plus
      # OpenCL_ROOT / OpenCL_LIBRARY, OCL_ICD_VENDORS or OCL_ICD_FILENAMES,
      # and SDKROOT on macOS.
      - name: Set up OpenCL
        id: opencl
        uses: coatless-actions/setup-opencl@v1
        with:
          runtime: ${{ matrix.config.opencl_runtime }}
          verify: 'true'
          require-fp64: 'true'

      - name: Report the OpenCL device
        shell: bash
        run: |
          echo "runtime  : ${{ steps.opencl.outputs.runtime-name }}"
          echo "platform : ${{ steps.opencl.outputs.platform-version }}"
          echo "device   : ${{ steps.opencl.outputs.device-name }}"
          echo "count    : ${{ steps.opencl.outputs.device-count }}"
          echo "fp64     : ${{ steps.opencl.outputs.fp64 }}"

      # Installs CLBlast and verifies a GEMM produces correct results.
      # Exports CLBLAST_CPPFLAGS / CLBLAST_LIBS -- which configure.win
      # already read and configure.ac now reads too -- plus CLBlast_DIR
      # (unused by this package, exported for contract parity).
      - name: Set up CLBlast
        uses: coatless-actions/setup-clblast@v1

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
